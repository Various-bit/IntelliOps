services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: intelliops-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelliops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelliops}
      POSTGRES_DB: ${POSTGRES_DB:-intelliops}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./data/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-intelliops} -d $${POSTGRES_DB:-intelliops}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescale_data: